plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services' // Ensure the alias is mapped to the correct plugin ID
}

android {
    namespace 'com.example.birds_view'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.birds_view"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders["MAPS_API_KEY"] = properties.getOrDefault("MAPS_API_KEY", "")

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Firebase BoM (to keep all Firebase dependencies compatible)
    implementation platform('com.google.firebase:firebase-bom:32.1.0')

    implementation libs.androidx.core.ktx.v190
    implementation libs.androidx.appcompat.v161
    implementation libs.material.v190
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.constraintlayout

    // Firebase dependencies
    implementation libs.firebase.auth.v2200
    implementation libs.firebase.firestore.v2420
    implementation 'com.google.firebase:firebase-appcheck-safetynet:16.0.1' // Add this line



    // Google Play Services for Maps and Location
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // OkHttp3 for making network requests
    implementation libs.okhttp
    implementation libs.androidx.activity

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit.v115
    androidTestImplementation libs.androidx.espresso.core.v351
}
